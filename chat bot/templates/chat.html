<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Inteligente</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body class="bg-gray-100 h-screen">
    <div class="container mx-auto p-4 h-full flex flex-col">
        <!-- Cabeçalho -->
        <header class="bg-white rounded-t-lg shadow-md p-4">
            <h1 class="text-2xl font-bold text-gray-800">Chatbot Inteligente</h1>
        </header>

        <!-- Área de Chat -->
        <div class="flex-1 bg-white shadow-md rounded-b-lg p-4 overflow-y-auto" id="chat-messages">
            <!-- Mensagens serão inseridas aqui -->
        </div>

        <!-- Área de Input -->
        <div class="mt-4 bg-white rounded-lg shadow-md p-4">
            <div class="flex items-center space-x-4">
                <!-- Botão de Gravação -->
                <button id="record-button" class="p-2 rounded-full bg-red-500 text-white hover:bg-red-600 focus:outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
                    </svg>
                </button>

                <!-- Campo de Texto -->
                <input type="text" id="message-input" 
                       class="flex-1 border rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500"
                       placeholder="Digite sua mensagem...">

                <!-- Botão de Envio -->
                <button id="send-button" 
                        class="bg-blue-500 text-white px-6 py-2 rounded-lg hover:bg-blue-600 focus:outline-none">
                    Enviar
                </button>
            </div>
        </div>
    </div>

    <script>
        // Configuração do Socket.IO
        const socket = io();
        const chatMessages = document.getElementById('chat-messages');
        const messageInput = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');
        const recordButton = document.getElementById('record-button');
        let mediaRecorder;
        let audioChunks = [];

        // Função para adicionar mensagem ao chat
        function addMessage(message, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `mb-4 ${isUser ? 'text-right' : 'text-left'}`;
            
            const messageBubble = document.createElement('div');
            messageBubble.className = `inline-block p-3 rounded-lg ${
                isUser ? 'bg-blue-500 text-white' : 'bg-gray-200 text-gray-800'
            }`;
            messageBubble.textContent = message;
            
            messageDiv.appendChild(messageBubble);
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Enviar mensagem
        function sendMessage() {
            const message = messageInput.value.trim();
            if (message) {
                socket.emit('message', {
                    user_id: 'user_' + Math.random().toString(36).substr(2, 9),
                    message: message
                });
                addMessage(message, true);
                messageInput.value = '';
            }
        }

        // Configurar gravação de áudio
        async function setupAudioRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);

                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    const reader = new FileReader();
                    reader.readAsDataURL(audioBlob);
                    reader.onloadend = () => {
                        const base64Audio = reader.result.split(',')[1];
                        socket.emit('voice_message', {
                            user_id: 'user_' + Math.random().toString(36).substr(2, 9),
                            audio: base64Audio
                        });
                    };
                    audioChunks = [];
                };
            } catch (err) {
                console.error('Erro ao acessar microfone:', err);
            }
        }

        // Event Listeners
        sendButton.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        recordButton.addEventListener('mousedown', () => {
            if (mediaRecorder && mediaRecorder.state === 'inactive') {
                mediaRecorder.start();
                recordButton.classList.add('animate-pulse');
            }
        });

        recordButton.addEventListener('mouseup', () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                recordButton.classList.remove('animate-pulse');
            }
        });

        // Socket.IO Event Handlers
        socket.on('connect', () => {
            console.log('Conectado ao servidor');
        });

        socket.on('response', (data) => {
            addMessage(data.message);
        });

        socket.on('error', (data) => {
            addMessage(`Erro: ${data.message}`);
        });

        // Inicializar gravação de áudio
        setupAudioRecording();
    </script>
</body>
</html>
