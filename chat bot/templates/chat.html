<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Bot IA</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Inter, Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }
        .app {
            width: min(900px, 100%);
            height: min(760px, 90vh);
            background: #111827;
            border: 1px solid #243244;
            border-radius: 24px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 24px 80px rgba(0,0,0,.35);
        }
        header {
            padding: 22px 24px;
            border-bottom: 1px solid #243244;
        }
        header h1 { margin: 0 0 6px; font-size: 1.35rem; }
        header p { margin: 0; color: #94a3b8; font-size: .92rem; }
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .message {
            max-width: 78%;
            padding: 12px 15px;
            border-radius: 16px;
            line-height: 1.5;
            white-space: pre-wrap;
        }
        .user { align-self: flex-end; background: #2563eb; color: white; border-bottom-right-radius: 5px; }
        .bot { align-self: flex-start; background: #1e293b; border-bottom-left-radius: 5px; }
        .composer {
            padding: 18px;
            border-top: 1px solid #243244;
            display: flex;
            gap: 10px;
            background: #0f172a;
        }
        input {
            flex: 1;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid #334155;
            background: #111827;
            color: #e2e8f0;
            outline: none;
        }
        input:focus { border-color: #3b82f6; }
        button {
            border: 0;
            border-radius: 12px;
            padding: 0 20px;
            font-weight: 700;
            cursor: pointer;
            background: #2563eb;
            color: white;
        }
        button:disabled { opacity: .55; cursor: wait; }
        .status { font-size: .8rem; color: #64748b; padding: 0 20px 14px; background: #0f172a; }
        @media (max-width: 640px) {
            body { padding: 0; }
            .app { height: 100vh; border-radius: 0; }
            .message { max-width: 88%; }
        }
    </style>
</head>
<body>
    <main class="app">
        <header>
            <h1>🤖 Chat Bot IA</h1>
            <p>Projeto de Leandro Augusto • Python + Flask + OpenAI</p>
        </header>

        <section id="messages">
            <div class="message bot">Olá! Estou pronto para conversar. Digite uma mensagem abaixo.</div>
        </section>

        <div class="composer">
            <input id="message" type="text" placeholder="Digite sua mensagem..." autocomplete="off">
            <button id="send">Enviar</button>
        </div>
        <div id="status" class="status">Conectado ao servidor local.</div>
    </main>

    <script>
        const messages = document.getElementById('messages');
        const input = document.getElementById('message');
        const button = document.getElementById('send');
        const status = document.getElementById('status');
        const userId = localStorage.getItem('chat_user_id') || crypto.randomUUID();
        localStorage.setItem('chat_user_id', userId);

        function addMessage(text, type) {
            const el = document.createElement('div');
            el.className = `message ${type}`;
            el.textContent = text;
            messages.appendChild(el);
            messages.scrollTop = messages.scrollHeight;
        }

        async function sendMessage() {
            const message = input.value.trim();
            if (!message || button.disabled) return;

            addMessage(message, 'user');
            input.value = '';
            button.disabled = true;
            status.textContent = 'A IA está respondendo...';

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, message })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Erro ao enviar mensagem.');
                addMessage(data.response, 'bot');
                status.textContent = 'Pronto.';
            } catch (error) {
                addMessage(`Erro: ${error.message}`, 'bot');
                status.textContent = 'Ocorreu um erro.';
            } finally {
                button.disabled = false;
                input.focus();
            }
        }

        button.addEventListener('click', sendMessage);
        input.addEventListener('keydown', event => {
            if (event.key === 'Enter') sendMessage();
        });
        input.focus();
    </script>
</body>
</html>
